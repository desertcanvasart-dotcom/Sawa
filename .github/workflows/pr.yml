# UUU1 — the gate that runs without anyone remembering.
#
# The step list lives in scripts/preflight.js and is derived by
# scripts/ci-gate.js. It is deliberately NOT restated here: a check added to
# preflight but not to CI would be invisible in exactly the situation CI exists
# for, and this repository has paid for that class of duplication more than once.
#
# No secrets. Nothing here needs production credentials — ci-gate supplies a
# dummy DATABASE_URL that never connects, so modules building a pool at import
# time still load. Verified: 390/390 with no .env present. The integration
# tests use a disposable Postgres service container (below), never production.
#
# What cannot run here is reported UNVERIFIED, never absent and never green.
name: Gate

on:
  pull_request:
    branches: [main]
  # VVV1.1 — and on main after merge. Without this, a red main is invisible
  # until the next pull request opens, which is a window measured in days on a
  # project with one committer.
  push:
    branches: [main]

# A second push to the same PR cancels the first — an in-flight run against
# superseded code is a verdict about nothing.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # O02 — a throwaway Postgres for the integration tests (*.integration.test.js):
    # the real migrations, the real server, driven over HTTP. It lives only for
    # this job and holds nothing but what the tests create; each test file makes
    # and drops its own database (server/test-db.js). Still no secrets.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5

      # WW3/XX1 — which runtime produced the evidence. The project pins >=22 and
      # check:node fails the gate on anything older, so this must match or the
      # first step reports a toolchain difference rather than a defect.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Run the credential-free gate
        run: node scripts/ci-gate.js
