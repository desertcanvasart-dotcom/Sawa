<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- This shell had no icon at all, so every SPA route — /tours, /blog and
         every tour and package page — showed a blank tab and fell back to a
         /favicon.ico that did not exist. The static pages carried their own
         inline SVG; these are the real mark, shared by both. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <link rel="apple-touch-icon" href="/images/favicon.png" />
    <!-- The server injects a plain-HTML copy of the route's content inside
         #root (server/seo.js buildBody) so crawlers that never run JavaScript
         still read /itineraries, every tour page and every blog post in full.
         React clears it the moment it mounts — but the bundle is a deferred
         module, so the browser had already PAINTED that bare markup: an
         unstyled wall of links flashing past before the real page arrived.
         Hiding it behind a class that only script can set keeps the markup
         byte-for-byte identical for a non-JS crawler while guaranteeing a
         browser never renders it. The script below is parser-blocking and runs
         before the body is parsed, so the rule is in force at the first paint.
         server/spa-shell.test.js holds both halves of that in place. -->
    <style>.js [data-server-rendered] { display: none }</style>
    <script>document.documentElement.classList.add("js");</script>
    <title>Sawa Shared Tours</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
