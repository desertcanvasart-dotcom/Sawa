<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- This shell had no icon at all, so every SPA route — /tours, /blog and
         every tour and package page — showed a blank tab and fell back to a
         /favicon.ico that did not exist. The static pages carried their own
         inline SVG; these are the real mark, shared by both. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <link rel="apple-touch-icon" href="/images/favicon.png" />
    <!-- Keep the server content readable until React replaces it. Merely
         enabling JavaScript does not mean the app or its data loaded. -->
    <style>[data-server-rendered] img { max-width: 100%; height: auto }</style>
    <title>Sawa Shared Tours</title>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) — the script half is injected into every
         SPA route's head by buildHead() in server/seo.js, so the container ID
         stays in site/assets/gtm.js alone. This half cannot be: no script runs
         in the case it exists for. -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MJNDLPKG"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
