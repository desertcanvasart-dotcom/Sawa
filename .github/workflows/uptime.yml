# The watchdog nothing else provides: is the site UP, while nobody is looking?
#
# Every other check in this repository runs at merge time or when a human runs
# it. If the host dies at 03:00, the first monitor to notice is a traveller.
# This is the no-new-account version of an uptime service: GitHub runs it on a
# schedule, and a failed run emails the repository owner through GitHub's own
# notification path — no webhook, no SMTP secret, nothing to configure.
#
# HONEST LIMITS, stated where the next reader will look:
#   · Hourly, not minute-ly. The repo is private, Actions minutes are metered,
#     and each scheduled job bills a minimum of one minute — hourly is ~720
#     minutes/month, which coexists with the PR gate inside the free tier.
#     A real uptime service (UptimeRobot, BetterStack — free tiers exist)
#     checks every 1–5 minutes from multiple regions and alerts by phone;
#     point it at the same two URLs and this workflow becomes the backstop.
#   · GitHub cron is best-effort and can drift by many minutes under load.
#
# The double-check with a pause exists so a single transient network blip on
# the runner does not page anyone at dawn. Two failures thirty seconds apart
# is an outage, not a blip.
name: Uptime

on:
  schedule:
    - cron: "7 * * * *"   # hourly at :07 — off the top-of-hour thundering herd
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Health and home respond
        run: |
          probe() {
            H=$(curl -sS --max-time 15 -o /dev/null -w "%{http_code}" https://sawa.tours/api/health || echo "000")
            B=$(curl -sS --max-time 15 https://sawa.tours/api/health || echo "")
            P=$(curl -sS --max-time 15 -o /dev/null -w "%{http_code}" https://sawa.tours/ || echo "000")
            echo "health=$H body=$B home=$P"
            [ "$H" = "200" ] && [ "$B" = '{"ok":true}' ] && [ "$P" = "200" ]
          }
          if probe; then echo "UP"; exit 0; fi
          echo "first probe failed — waiting 30s to rule out a blip"
          sleep 30
          if probe; then echo "UP (first probe was a blip)"; exit 0; fi
          echo "::error::sawa.tours is DOWN — two probes failed 30s apart"
          exit 1
